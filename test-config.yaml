export:
  compress_outputs: false
  csv_delimiter: ','
  export_formats:
  - csv
  - json
  - txt
  include_metadata: true
log_level: INFO
output_dir: output
processing:
  blur_kernel_size: 5
  contrast_alpha: 1.5
  contrast_beta: 0
  grayscale_conversion: weighted
ruler_detection:
  canny_threshold1: 50
  canny_threshold2: 150
  enabled: true
  expected_tick_distance_mm: 1.0
  hough_threshold: 20
  max_line_gap: 10
  min_line_length: 50
shape_detection:
  approx_epsilon_ratio: 0.02
  detection_method: contour
  max_area: 50000
  max_vertices: 20
  min_area: 100
  min_vertices: 3
thickness:
  a: 1.0
  b: 0.0
  model_type: linear
  saturation_threshold: 250
uniformity:
  bin_count: 50
  num_radial_lines: 36
  smoothing_factor: 0.5
visualization:
  colormap: viridis
  dpi: 300
  figure_size: !!python/tuple
  - 10
  - 8
  show_saturated: true
