[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esnf-mat-analyzer"
version = "1.0.0"
description = "Advanced electrospun nanofiber mat analysis tool with comprehensive uniformity metrics"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "ESNF Mat Analyzer Team", email = "your.email@domain.com"}
]
maintainers = [
    {name = "ESNF Mat Analyzer Team", email = "your.email@domain.com"}
]
keywords = [
    "nanofiber",
    "electrospinning", 
    "image-analysis",
    "materials-science",
    "uniformity-metrics",
    "microscopy",
    "fiber-mats",
    "anisotropy",
    "texture-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "opencv-python>=4.5.0",
    "scikit-image>=0.18.0",
    "Pillow>=8.0.0",
    "pyyaml>=5.4.0",
    "dataclasses>=0.8; python_version<'3.7'",
    "typing-extensions>=3.7.4; python_version<'3.8'",
]

[project.optional-dependencies]
cli = [
    "colorama>=0.4.0",
    "tqdm>=4.60.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
    "pre-commit>=2.10",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=0.5",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "pytest-mock>=3.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=0.5",
    "sphinx-autodoc-typehints>=1.11",
    "myst-parser>=0.15",
]
full = [
    "colorama>=0.4.0",
    "tqdm>=4.60.0",
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
]

[project.urls]
Homepage = "https://github.com/DocRuzzy/esnf-mat-analyzer"
Documentation = "https://github.com/DocRuzzy/esnf-mat-analyzer/blob/main/README.md"
Repository = "https://github.com/DocRuzzy/esnf-mat-analyzer"
"Bug Reports" = "https://github.com/DocRuzzy/esnf-mat-analyzer/issues"
Changelog = "https://github.com/DocRuzzy/esnf-mat-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
esnf-analyzer = "esnf_mat_analyzer.main:main"
esnf-gui = "esnf_mat_analyzer.gui.main_window:main"

[project.gui-scripts]
esnf-analyzer-gui = "esnf_mat_analyzer.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["esnf_mat_analyzer*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"esnf_mat_analyzer" = ["*.yaml", "*.yml", "*.json"]
"esnf_mat_analyzer.config" = ["*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gui: marks tests as GUI tests",
]

[tool.coverage.run]
source = ["esnf_mat_analyzer"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "setup_environment.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "skimage.*",
    "scipy.*",
    "matplotlib.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "docs/conf.py",
    "old",
    "build",
    "dist",
    ".eggs",
    "*.egg",
]
per-file-ignores = [
    "__init__.py:F401",
]
